<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session · pi sessions</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('pi-sessions-theme'); } catch (_) {}
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
        ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <style>
{{CSS}}
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to conversation</a>
  <button id="hamburger" type="button" title="Open session navigation" aria-label="Open session navigation" aria-controls="sidebar" aria-expanded="false"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><rect x="5" y="6" width="2" height="12"/><path d="M6 12h10c1 0 2 0 2-2V8"/></svg></button>
  <div id="sidebar-overlay"></div>
  <div id="app">
    <aside id="sidebar" aria-label="Session navigation">
      <div class="sidebar-header">
        <div class="sidebar-brand"><span class="brand-mark" aria-hidden="true">π</span><div><strong>Session navigator</strong><span>Explore the conversation</span></div></div>
        <div class="sidebar-controls">
          <label class="sr-only" for="tree-search">Search session entries</label>
          <input type="search" class="sidebar-search" id="tree-search" placeholder="Search this session…" autocomplete="off" aria-keyshortcuts="/">
        </div>
        <div class="sidebar-filters">
          <button class="filter-btn active" data-filter="default" title="Hide settings entries">Default</button>
          <button class="filter-btn" data-filter="no-tools" title="Default minus tool results">No tools</button>
          <button class="filter-btn" data-filter="user-only" title="Only user messages">User</button>
          <button class="filter-btn" data-filter="labeled-only" title="Only labeled entries">Labeled</button>
          <button class="filter-btn" data-filter="all" title="Show everything">All</button>
          <button class="sidebar-close" id="sidebar-close" title="Close navigation" aria-label="Close navigation">✕</button>
        </div>
      </div>
      <nav class="tree-container" id="tree-container" aria-label="Session entries"></nav>
      <div class="tree-status" id="tree-status" role="status" aria-live="polite"></div>
      <div class="sidebar-shortcuts"><kbd>/</kbd> Search <span>·</span> <kbd>↑</kbd> <kbd>↓</kbd> Navigate</div>
    </aside>
    <div id="sidebar-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize session navigation" aria-controls="sidebar"></div>
    <main id="content" tabindex="-1" aria-label="Conversation">
      <div id="header-container"></div>
      <div id="messages"></div>
    </main>
    <div id="image-modal" class="image-modal" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
      <button id="image-modal-close" type="button" aria-label="Close image preview">✕</button>
      <img id="modal-image" alt="">
    </div>
  </div>
  <div id="reader-status" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><p class="reader-empty">JavaScript is required to view this session. All reader scripts are included locally.</p></noscript>

  <script id="session-data" type="application/json">{{SESSION_DATA}}</script>

  <!-- Vendored libraries -->
  <script>{{MARKED_JS}}</script>

  <!-- highlight.js -->
  <script>{{HIGHLIGHT_JS}}</script>

  <!-- Main application code -->
  <script>
{{JS}}
  </script>
</body>
</html>
